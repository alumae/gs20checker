[project]
name = "gs20checker"
version = "0.1.0"
description = "Check publication venues against Google Scholar Metrics Top 20 lists."
requires-python = ">=3.12"
# Vercel installs this list with uv. Keep it aligned with requirements.txt.
dependencies = [
    "Flask>=3.1,<4",
    "openai>=2,<3",
    "openpyxl>=3.1,<3.2",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
    "bibtexparser>=1.4,<2",
    "python-dotenv>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["._*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
